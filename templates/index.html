<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro para Evento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .container { max-width: 600px; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="text-center mb-4" id="title-container">
    <h2>Registro para Evento</h2>
    <p class="lead">Completa tus datos para generar tu código de acceso QR.</p>
  </div>
  <div class="card shadow-sm" id="form-container">
    <div class="card-body p-4">
      <form id="formRegistro">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre Completo</label>
          <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo Electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" required>
        </div>
        <div class="mb-3">
          <label for="curp" class="form-label">CURP</label>
          <input type="text" class="form-control" id="curp" name="curp" required minlength="18" maxlength="18" style="text-transform: uppercase;">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="edad" class="form-label">Edad</label>
            <input type="number" class="form-control" id="edad" name="edad" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="genero" class="form-label">Género</label>
            <select class="form-select" id="genero" name="genero" required>
              <option value="" selected disabled>Seleccionar...</option>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
              <option value="Otro">Otro</option>
              <option value="Prefiero no decirlo">Prefiero no decirlo</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label for="colonia" class="form-label">Colonia</label>
          <input type="text" class="form-control" id="colonia" name="colonia" required>
        </div>
        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono Móvil</label>
          <input type="tel" class="form-control" id="telefono" name="telefono" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Generar mi Código QR</button>
      </form>
    </div>
  </div>

  <div id="resultado" class="mt-4"></div>
</div>

<script>
    document.getElementById("formRegistro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Generando...';
      
      const formData = new FormData(e.target);
      const response = await fetch("/registro", { method: "POST", body: formData });
      const result = await response.json();
      const resultadoDiv = document.getElementById("resultado");

      if (response.ok) {
        // Ocultar el formulario y el título
        document.getElementById("form-container").style.display = "none";
        document.getElementById("title-container").style.display = "none";

        // Construir la nueva tarjeta de pase
        resultadoDiv.innerHTML = `
          <div class="card shadow-sm text-center">
            <div class="card-body p-4">
              <h2 class="card-title text-success">¡Registro Exitoso!</h2>
              <p class="card-text">Este es tu pase de entrada. Preséntalo al momento de acceder.</p>
              <hr>
              <div id="qr-canvas" class="d-flex justify-content-center my-3"></div>
              <div class="d-grid gap-2 mt-3">
                <a href="/download-pass/${result.pdf_filename}" class="btn btn-primary w-100" download>
                  Ver Código QR
                </a>
                <button onclick="window.location.reload()" class="btn btn-outline-secondary mt-2">Registrar otra persona</button>
              </div>
            </div>
          </div>`;
        
        // Dibujar el QR dinámicamente en el contenedor
        new QRCode(document.getElementById("qr-canvas"), {
            text: result.checkin_url,
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
      } else {
        resultadoDiv.innerHTML = `<div class="alert alert-danger"><b>Error:</b> ${result.msg || 'Ocurrió un problema, intenta de nuevo.'}</div>`;
        // Re-enable button on error
        btn.disabled = false;
        btn.textContent = 'Generar mi Código QR';
      }
    });
</script>
</body>
</html>
